const API=window.KS_API||'/api';
let TOKEN=null;try{TOKEN=localStorage.getItem('ks_tok')}catch(e){}

async function api(path,o={}){
 const h={};if(TOKEN)h.Authorization='Token '+TOKEN;if(o.body)h['Content-Type']='application/json';
 const r=await fetch(API+path,{method:o.method||'GET',headers:h,body:o.form||(o.body?JSON.stringify(o.body):undefined)});
 const d=r.status===204?null:await r.json().catch(()=>({}));
 if(!r.ok){if(r.status===401&&TOKEN)clearAuth();const e=new Error(friendly(r.status,d.detail||Object.values(d).flat().join(' ')));e.status=r.status;throw e}
 return d}
function clearAuth(){TOKEN=null;try{localStorage.removeItem('ks_tok')}catch(e){}}
async function pages(path){let out=[],u=path+(path.includes('?')?'&':'?')+'page_size=200';
 while(u){const d=await api(u);if(Array.isArray(d))return d;out=out.concat(d.results);u=d.next?d.next.slice(d.next.indexOf('/api')+4):null}return out}
const sid=x=>String(x);
const mapW=w=>({id:sid(w.id),name:w.name,skill:w.skill,city:w.city,phone:w.phone||'',exp:w.exp,pay:mpay(w.pay),avail:w.avail,about:w.about||'',photo:w.photo||'',status:w.status||'verified',hired:!!(w.hired||w.is_hired)});
const mapB=b=>({id:sid(b.id),name:b.name,city:b.city,status:b.status,plan:b.plan||'Free',credits:b.credits||0});
const mapS=s=>({id:sid(s.id),bizId:sid(s.business),workerId:sid(s.worker.id),status:s.status});
async function hydrate(){
 const u=S.user,n={biz:[],workers:[],sel:[],inv:[]};
 let pub=[];try{pub=(await pages('/workers/')).map(mapW)}catch(e){}
 n.workers=pub;
 if(u&&u.role==='worker'){
  const me=mapW(await api('/me/worker/'));n.workers=[me].concat(pub.filter(w=>w.id!==me.id));
  (await api('/me/chosen/')).forEach(c=>{n.biz.push(mapB(c.business));n.sel.push({id:sid(c.id),bizId:sid(c.business.id),workerId:me.id,status:c.status})});
 }else if(u&&u.role==='biz'){
  const b=mapB(await api('/me/business/'));n.biz=[b];
  const ss=await pages('/selections/');n.sel=ss.map(mapS);
  const got=ss.map(s=>mapW(s.worker));n.workers=got.concat(pub.filter(w=>!got.some(g=>g.id===w.id)));
  n.inv=(await api('/billing/')).invoices.map(v=>({id:sid(v.id),bizId:b.id,plan:v.plan,amt:v.amount,status:v.status}));
 }else if(u&&u.role==='admin'){
  n.workers=(await pages('/admin/workers/')).map(mapW);n.biz=(await pages('/admin/businesses/')).map(mapB);
  n.sel=(await pages('/selections/')).map(mapS);
  n.inv=(await pages('/admin/invoices/')).map(v=>({id:sid(v.id),bizId:sid(v.business),plan:v.plan,amt:v.amount,status:v.status}));
 }
 D=n}

/* ===== Employee wording, monthly pay, validated login / profile ===== */
function emp(s){return String(s).replace(/(?<!Factory |Construction )workers/g,'employees').replace(/(?<!Factory |Construction )Workers/g,'Employees').replace(/(?<!Factory |Construction )worker/g,'employee').replace(/(?<!Factory |Construction )Worker/g,'Employee').replace(/(?<!बांधकाम )(?<!कारखाना )(?<!फैक्ट्री )कामगार/g,'कर्मचारी')}
function INR(n){return '₹'+Number(n).toLocaleString('en-IN')}
function payNum(s){const m=String(s||'').match(/\d[\d,]*/);return m?m[0].replace(/,/g,''):''}
function mpay(s){s=String(s||'');const n=+payNum(s);if(!n)return s;if(/day/i.test(s))return INR(Math.round(n*26/500)*500)+' / month';if(/week/i.test(s))return INR(Math.round(n*4.3/500)*500)+' / month';return INR(n)+' / month'}
const RX={name:/^[\p{L}][\p{L}\p{M} .'-]{1,59}$/u,city:/^[\p{L}][\p{L}\p{M} .'-]{1,39}$/u,user:/^[\w.@-]{3,30}$/,pw:/^(?=.*[A-Za-z])(?=.*\d).{8,64}$/};
function ph(s){let d=String(s).replace(/[\s()-]/g,'');if(d.length>10)d=d.replace(/^\+?91/,'').replace(/^0/,'');return /^[6-9]\d{9}$/.test(d)?d:null}

async function api(path,o={}){
 const h={};if(TOKEN)h.Authorization='Token '+TOKEN;if(o.body)h['Content-Type']='application/json';
 let r;try{r=await fetch(API+path,{method:o.method||'GET',headers:h,body:o.form||(o.body?JSON.stringify(o.body):undefined)})}
 catch(e){const x=new Error('No internet right now. Please check your network and try again. · नेटवर्क नहीं है। कृपया फिर कोशिश करें।');x.status=0;throw x}
 const json=(r.headers.get('content-type')||'').includes('json');
 if(r.status!==204&&!json){const x=new Error('Please try again in a minute. · कृपया थोड़ी देर बाद फिर कोशिश करें।');x.status=r.status;throw x}
 const d=r.status===204?null:await r.json().catch(()=>({}));
 if(!r.ok){if(r.status===401&&TOKEN)clearAuth();const x=new Error(friendly(r.status,d.detail||Object.values(d).flat().join(' ')));x.status=r.status;throw x}
 return d}

 try{const d=await api('/billing/link/',{method:'POST',body:{plan:n}});url=d.short_url||d.url||''}catch(e){}

 if(!RZP_OK.test(url)){if(w)w.close();return toast('The Razorpay link for the '+n+' plan is not set up yet. Please contact support.')}
 S.pay={plan:n,url};if(w)w.location.href=url;render()}

const CH={msgs:[],busy:false},CHIPS=['How do I register?','How do credits work?','मला काम कसे मिळेल?'];
function mkInit(){
 const d=document.createElement('div');
 d.innerHTML=`<button class="mk-fab" id="mk-fab" aria-label="Open Mukadam assistant" onclick="mkToggle()"><span class="mk-av">M</span>Mukadam</button><section class="mk" id="mk" role="dialog" aria-label="Mukadam assistant" hidden><header><span class="mk-av">M</span><div><b>Mukadam</b><small>KaamSetu assistant · सहायक</small></div><button aria-label="Close assistant" onclick="mkToggle()">✕</button></header><div id="mk-log" aria-live="polite"></div><div id="mk-chips">${CHIPS.map(c=>`<button onclick="mkSend(this.textContent)">${c}</button>`).join('')}</div><div class="mk-in"><input id="mk-i" maxlength="500" aria-label="Your question" placeholder="Ask anything · कुछ भी पूछें" onkeydown="if(event.key==='Enter')mkSend()"><button class="btn gold sm" onclick="mkSend()">Send</button></div></section>`;
 document.body.appendChild(d);
 document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!document.getElementById('mk').hidden)mkToggle()});
 mkDraw()}
function mkToggle(){const p=document.getElementById('mk'),o=p.hidden;p.hidden=!o;document.getElementById('mk-fab').hidden=o;if(o)document.getElementById('mk-i').focus()}
function mkDraw(){
 const hi={role:'assistant',content:'Namaste! I am Mukadam. Ask me how to find work, hire workers, or use KaamSetu. · नमस्ते! मी मुकादम. काम शोधायला किंवा कामगार निवडायला मदत करतो.'};
 const l=document.getElementById('mk-log');
 l.innerHTML=[hi].concat(CH.msgs).map(m=>`<div class="mk-m ${m.role==='user'?'u':'b'}">${esc(m.content)}</div>`).join('')+(CH.busy?'<div class="mk-m b">…</div>':'');
 l.scrollTop=l.scrollHeight;document.getElementById('mk-chips').hidden=CH.msgs.length>0}
async function mkSend(t){
 const i=document.getElementById('mk-i'),q=(t||i.value).trim();if(!q||CH.busy)return;i.value='';
 CH.msgs.push({role:'user',content:q});CH.busy=true;mkDraw();
 try{const r=await api('/chat/',{method:'POST',body:{messages:CH.msgs.slice(-12),role:S.user?S.user.role:''}});CH.msgs.push({role:'assistant',content:r.reply})}
 catch(e){CH.msgs.push({role:'assistant',content:e.status===429?'You have asked a lot just now. Please try again in a while.':tr(e.message||'Something went wrong. Please try again.')})}
 CH.busy=false;mkDraw()}

function mascotInit(){
 const m=document.getElementById('mascot');if(!m)return;
 const L=S.lang,T=L==='en'?DUO.en:L==='mr'?DUO.mr:DUO.hi,sm=L==='both'?DUO.en:['',''];
 m.innerHTML=`<div class="duo"><div class="who a"><div class="bubble"><div class="mb" id="mbA" aria-live="polite"></div>${sm[0]?`<small>${sm[0]}</small>`:''}</div><div class="mchar" onclick="mascotSpeak()" role="img" aria-label="Jatin saying he needs a job">${SVGA}</div><span class="nm">जतिन · Jatin</span></div><div class="who b"><div class="bubble"><div class="mb" id="mbB" aria-live="polite"></div>${sm[1]?`<small>${sm[1]}</small>`:''}</div><div class="mchar" onclick="mascotSpeak()" role="img" aria-label="Friend saying: make a profile on KaamSetu and get a job">${SVGB}</div><span class="nm">कामसेतु दोस्त · KaamSetu friend</span></div></div><button type="button" class="listen" onclick="mascotSpeak()" aria-label="Listen">🔊 <span>${L==='en'?'Listen':L==='mr'?'ऐका':'सुनो'}</span></button>`;
 clearInterval(S.mt);const a=document.getElementById('mbA'),b=document.getElementById('mbB');let i=0,j=0;
 S.mt=setInterval(()=>{if(i<T[0].length){a.textContent=T[0].slice(0,++i)}else if(j<T[1].length){b.textContent=T[1].slice(0,++j)}else clearInterval(S.mt)},45)}
function mascotVoices(lang){
 const all=speechSynthesis.getVoices(),pre=lang.slice(0,2),nl=x=>x.lang.replace('_','-').toLowerCase();
 const FEM=/female|woman|heera|kalpana|swara|aarohi|neerja|lekha|isha|veena|priya|zira|hazel|samantha|karen|google (हिन्दी|हिंदी|hindi)/i;
 const MAL=/\bmale\b|hemant|madhur|manohar|prabhat|ravi|rishi|rahul|daniel|alex|david|mark|guy|ryan|george|fred/i;
 const pick=f=>all.filter(x=>nl(x)===lang.toLowerCase()&&f(x)).concat(all.filter(x=>nl(x)!==lang.toLowerCase()&&nl(x).startsWith(pre)&&f(x)));
 let m=pick(x=>MAL.test(x.name)&&!FEM.test(x.name));
 if(!m.length&&pre==='mr')m=all.filter(x=>nl(x).startsWith('hi')&&MAL.test(x.name)&&!FEM.test(x.name));
 const real=m.length>0;
 if(!m.length)m=pick(x=>!FEM.test(x.name));
 if(!m.length)m=pick(()=>true);
 if(!m.length&&pre==='mr'){const h=all.filter(x=>nl(x).startsWith('hi'));m=h.filter(x=>!FEM.test(x.name)).concat(h)}
 return{list:m,real}}
async function mascotSpeak(){
 if(!('speechSynthesis' in window))return toast('Sound is not available on this phone.');
 const L=S.lang,T=L==='en'?DUO.en:L==='mr'?DUO.mr:DUO.hi,lang=L==='en'?'en-IN':L==='mr'?'mr-IN':'hi-IN',ch=document.querySelectorAll('.mchar');
 if(!speechSynthesis.getVoices().length)await new Promise(r=>{speechSynthesis.addEventListener('voiceschanged',()=>r(),{once:true});setTimeout(r,700)});
 /* both characters are men: use a male voice when the phone has one, otherwise a deeper pitch */
 const{list,real}=mascotVoices(lang),pit=real?[1,.85]:[.7,.5],vs=[list[0],list[1]||list[0]];
 const say=(i,t)=>new Promise(res=>{const u=new SpeechSynthesisUtterance(t);u.lang=lang;u.rate=.88;u.pitch=pit[i];if(vs[i])u.voice=vs[i];const off=()=>{ch[i]&&ch[i].classList.remove('talk');res()};u.onstart=()=>ch[i]&&ch[i].classList.add('talk');u.onend=off;u.onerror=off;speechSynthesis.speak(u)});
 speechSynthesis.cancel();say(0,T[0]).then(()=>say(1,T[1]))}

function friendly(st,m){const G='Something went wrong. Please try again. · कुछ गड़बड़ हो गई। फिर कोशिश करें।';m=String(m||'').trim();
 if(st===429)return 'Too many tries. Please wait a little. · बहुत बार कोशिश हुई। थोड़ा रुकें।';
 if(st>=500||!m||m.length>160||/traceback|exception|server|django|internal|<\/?\w+|undefined|\bnull\b|\b(error|errno)\b|sql|\bapi\b/i.test(m))return G;
 return m}
let _et=0;const oops=()=>{if(Date.now()-_et<4000)return;_et=Date.now();try{toast('Something went wrong. Please try again. · कुछ गड़बड़ हो गई। फिर कोशिश करें।')}catch(e){}};
addEventListener('error',oops);addEventListener('unhandledrejection',e=>{e.preventDefault();oops()});
function mkClick(){document.querySelectorAll('[onclick]').forEach(e=>{if(/^(BUTTON|A|INPUT|SELECT|SUMMARY)$/.test(e.tagName)||e.hasAttribute('tabindex'))return;e.setAttribute('role','button');e.tabIndex=0;e.style.cursor='pointer'})}
document.addEventListener('keydown',e=>{const t=e.target;if((e.key==='Enter'||e.key===' ')&&t.getAttribute&&t.getAttribute('role')==='button'&&!/^(BUTTON|A|INPUT|TEXTAREA|SELECT)$/.test(t.tagName)){e.preventDefault();t.click()}});
{const r0=render;render=function(){r0();mascotInit();mkClick()}}
render();
mkInit();
boot();
