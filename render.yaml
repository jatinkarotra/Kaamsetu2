# Render Blueprint: New + > Blueprint > pick your GitHub repo.
# Both start on the FREE plans. Free web services sleep after 15 min idle, and the free
# database is deleted ~44 days after creation. For real users change both plans (see README).
services:
  - type: web
    name: kaamsetu
    runtime: node
    region: singapore
    plan: free            # change to "starter" so it never sleeps
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NODE_ENV
        value: production
      - key: SECRET
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: kaamsetu-db
          property: connectionString
      - key: ADMIN_USER
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: TWILIO_ACCOUNT_SID
        sync: false
      - key: TWILIO_AUTH_TOKEN
        sync: false
      - key: TWILIO_VERIFY_SID
        sync: false
      - key: PUBLIC_URL      # e.g. https://kaamsetu.onrender.com (optional, for Razorpay)
        sync: false
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false
      - key: RAZORPAY_WEBHOOK_SECRET
        sync: false

databases:
  - name: kaamsetu-db
    region: singapore
    plan: free            # change to a paid plan (e.g. basic-256mb) before real users arrive
